name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Consumer regressions reconstruct the legacy schema from committed history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp

      - name: Lint
        run: uv run --extra dev --extra mcp ruff check .

      - name: Type check
        run: uv run --extra dev --extra mcp mypy --strict src/ --ignore-missing-imports

      - name: Test
        run: uv run --extra dev --extra mcp pytest -v --cov=vaultmind --cov-report=term-missing

  offline-acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
        case: [retrieval, mcp, approval, config]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Approval reconstructs the legacy migration schema from committed history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra mcp
      - name: Verify offline ${{ matrix.case }}
        shell: bash
        run: |
          export HOME="$(mktemp -d "$RUNNER_TEMP/vaultmind-home.XXXXXX")"
          uv run --extra dev --extra mcp python scripts/verify_acceptance.py \
            --case "${{ matrix.case }}" --offline \
            --receipt-out "$RUNNER_TEMP/acceptance-${{ matrix.python-version }}-${{ matrix.case }}.json"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra mcp
      - run: uv run --extra dev --extra mcp ruff format --check .
