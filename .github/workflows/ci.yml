name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp

      - name: Lint
        run: uv run --extra dev --extra mcp ruff check .

      - name: Type check
        run: uv run --extra dev --extra mcp mypy --strict src/ --ignore-missing-imports

      - name: Test
        run: uv run --extra dev --extra mcp pytest -v --cov=vaultmind --cov-report=term-missing

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra mcp
      - run: uv run --extra dev --extra mcp ruff format --check .
